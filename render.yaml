services:
  - type: web
    name: quiz-backend-api
    runtime: node
    plan: free
    buildCommand: cd quiz-management-system/backend && npm install
    startCommand: cd quiz-management-system/backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        generateValue: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://kumartharun199216-hue.github.io/quiz/
